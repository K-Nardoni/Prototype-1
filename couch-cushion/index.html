<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Couch Cushion · Month-end allocation</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f0eee9;
    font-family: "DM Sans", system-ui, sans-serif;
    color: #29261b;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="flow.jsx"></script>
<script type="text/babel" src="safe.jsx"></script>
<script type="text/babel" src="bold.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "surplus": 115,
  "showWorstCase": true,
  "volatility": 1.1
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Re-init Lucide on every render so new <i data-lucide> nodes get materialized.
  React.useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons({ attrs: { 'stroke-width': '2.75', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' } });
    }
  });

  return (
    <>
      <DesignCanvas>
        <DCSection id="couch-cushion" title="Couch Cushion by Kelby Nardoni"
          subtitle="Two visual treatments of the same flow. Both interactive — drag the allocator, accept the AI rec, walk through to confirm + goal setup.">
          <DCArtboard id="safe" label="A · Safe — cream, soft, AI-led" width={402} height={874}>
            <SafeFlow surplus={t.surplus} showWorstCase={t.showWorstCase} volatility={t.volatility} />
          </DCArtboard>
          <DCArtboard id="bold" label="B · Bold — dark, data-forward, bars" width={402} height={874}>
            <BoldFlow surplus={t.surplus} showWorstCase={t.showWorstCase} volatility={t.volatility} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Scenario" />
        <TweakSlider label="Surplus" value={t.surplus} min={5} max={500} step={5} unit="$"
          onChange={(v) => setTweak('surplus', v)} />
        <TweakSection label="Risk treatment" />
        <TweakToggle label="Show worst-case band" value={t.showWorstCase}
          onChange={(v) => setTweak('showWorstCase', v)} />
        <TweakSlider label="S&P volatility" value={Math.round(t.volatility * 10) / 10}
          min={0.5} max={2.0} step={0.1} unit="×"
          onChange={(v) => setTweak('volatility', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
